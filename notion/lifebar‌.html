<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Progress Widget</title>
<style>
    /* 全局重置与居中：自适应 Notion 嵌入块的任意尺寸 */
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: transparent; /* 透明背景，完美适配 Notion 明暗主题 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 容器：随插件嵌入窗口弹性撑满并居中展示 */
    .widget-container {
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 进度条垂直排列列表 */
    .progress-group {
        display: flex;
        flex-direction: column;
        gap: 12px; 
    }
    
    /* 单行布局：进度条 + 右侧文字 */
    .progress-item {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    /* 进度条外框：如图形状（微圆角深黑边框，内嵌白底与留白） */
    .progress-outline {
        width: 160px;          /* 进度条固定长度（可按需调长或调短） */
        height: 24px;         /* 进度条粗细/高度 */
        border: 2px solid #111111;
        border-radius: 6px;   /* 截图风格的微圆角 */
        padding: 2.5px;       /* 边框与内部填充物的微小缝隙 */
        background-color: #ffffff;
        display: flex;
        align-items: center;
        flex-shrink: 0;
    }

    /* 进度条内部纯黑填充 */
    .progress-fill {
        height: 100%;
        background-color: #111111;
        border-radius: 2px;
        width: 0%;
        transition: width 0.8s ease-out;
    }

    /* 右侧文字说明 */
    .progress-text {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #555555;
        min-width: 85px;
        letter-spacing: -0.2px;
    }
</style>
</head>
<body>

<div class="widget-container">
    <div class="progress-group">
        <div class="progress-item">
            <div class="progress-outline">
                <div class="progress-fill" id="fill-year"></div>
            </div>
            <p class="progress-text" id="text-year">Year: 0%</p>
        </div>

        <div class="progress-item">
            <div class="progress-outline">
                <div class="progress-fill" id="fill-month"></div>
            </div>
            <p class="progress-text" id="text-month">Month: 0%</p>
        </div>

        <div class="progress-item">
            <div class="progress-outline">
                <div class="progress-fill" id="fill-week"></div>
            </div>
            <p class="progress-text" id="text-week">Week: 0%</p>
        </div>

        <div class="progress-item">
            <div class="progress-outline">
                <div class="progress-fill" id="fill-day"></div>
            </div>
            <p class="progress-text" id="text-day">Day: 0%</p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 核心算法：保留原有时间戳比例推演
    // ==========================================
    function updateTimeProgress() {
        const now = new Date();
        const nowMs = now.getTime(); 

        const year = now.getFullYear();
        const month = now.getMonth();
        const date = now.getDate();

        // 1. Day 进度
        const startOfDay = new Date(year, month, date).getTime();
        const dayTotalMs = 24 * 60 * 60 * 1000;
        const dayProgress = (nowMs - startOfDay) / dayTotalMs;

        // 2. Week 进度 (周一为起点)
        const dayOfWeek = now.getDay();
        const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1; 
        const startOfWeek = new Date(year, month, date - diffToMonday).getTime();
        const weekTotalMs = 7 * 24 * 60 * 60 * 1000;
        const weekProgress = (nowMs - startOfWeek) / weekTotalMs;

        // 3. Month 进度
        const startOfMonth = new Date(year, month, 1).getTime();
        const startOfNextMonth = new Date(year, month + 1, 1).getTime();
        const monthProgress = (nowMs - startOfMonth) / (startOfNextMonth - startOfMonth);

        // 4. Year 进度
        const startOfYear = new Date(year, 0, 1).getTime();
        const startOfNextYear = new Date(year + 1, 0, 1).getTime();
        const yearProgress = (nowMs - startOfYear) / (startOfNextYear - startOfYear);

        // ==========================================
        // DOM 注入与视图更新
        // ==========================================
        const dataMap = [
            { id: 'year', percent: Math.floor(yearProgress * 100), label: 'Year' },
            { id: 'month', percent: Math.floor(monthProgress * 100), label: 'Month' },
            { id: 'week', percent: Math.floor(weekProgress * 100), label: 'Week' },
            { id: 'day', percent: Math.floor(dayProgress * 100), label: 'Day' }
        ];

        dataMap.forEach(item => {
            const fillElem = document.getElementById(`fill-${item.id}`);
            const textElem = document.getElementById(`text-${item.id}`);
            if (fillElem) fillElem.style.width = `${item.percent}%`;
            if (textElem) textElem.innerText = `${item.label}: ${item.percent}%`;
        });
    }

    updateTimeProgress();
    setInterval(updateTimeProgress, 1000);
</script>

</body>
</html>
