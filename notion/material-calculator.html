<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天赋书计算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            genshinBrown: '#c69468',
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      width: 180px;
      max-width: 180px;
      min-width: 180px;
      margin: 0;
      padding: 4px;
      box-sizing: border-box;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      user-select: none;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="text-slate-800 dark:text-slate-200">
  <div class="w-full flex flex-col gap-2">
    <!-- 顶部标题行 -->
    <div class="px-0.5 pt-0.5">
      <h1 class="text-xs font-bold text-slate-800 dark:text-slate-100 tracking-tight">天赋书计算器</h1>
    </div>

    <!-- 角色列表容器 -->
    <div id="character-list" class="flex flex-col gap-1.5"></div>

    <!-- 添加角色按钮 -->
    <button 
      id="add-btn" 
      type="button"
      class="w-full py-1 text-[11px] font-medium text-slate-600 dark:text-slate-300 bg-slate-100/90 dark:bg-slate-800/90 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-[0.98] rounded border border-slate-200 dark:border-slate-700 transition flex items-center justify-center gap-1"
    >
      <span class="text-xs leading-none">＋</span> 添加角色
    </button>
  </div>

  <script>
    // ================= 云同步配置 (JSONbin.io) =================
    const JSONBIN_CONFIG = {
      binId: "6ac4e3caac6210605a18d84c",
      apiKey: "$2a$10$ZMPI1giAz6admUWWgW3RHeqMugBe3Cx5zQnz.RMZVkCsmE9ukdmFq",
      enabled: true
    };
    const LOCAL_KEY = 'genshin_talent_calc_180px_data';
    // ============================================================

    // 天赋升级单技能累计所需材料 (2 ~ 10 级)
    const LEVEL_REQUIREMENTS = {
      2: { brown: 3, silver: 0, gold: 0 },
      3: { brown: 0, silver: 2, gold: 0 },
      4: { brown: 0, silver: 4, gold: 0 },
      5: { brown: 0, silver: 6, gold: 0 },
      6: { brown: 0, silver: 9, gold: 0 },
      7: { brown: 0, silver: 0, gold: 4 },
      8: { brown: 0, silver: 0, gold: 6 },
      9: { brown: 0, silver: 0, gold: 12 },
      10: { brown: 0, silver: 0, gold: 16 }
    };

    function calculateSingleSkill(levelInput) {
      const lvl = parseInt(levelInput, 10);
      let brown = 0, silver = 0, gold = 0;
      if (isNaN(lvl) || lvl <= 1) return { brown, silver, gold };
      const target = Math.min(lvl, 10);
      for (let i = 2; i <= target; i++) {
        brown += LEVEL_REQUIREMENTS[i].brown;
        silver += LEVEL_REQUIREMENTS[i].silver;
        gold += LEVEL_REQUIREMENTS[i].gold;
      }
      return { brown, silver, gold };
    }

    function calculateTotalCost(t1, t2, t3) {
      const s1 = calculateSingleSkill(t1);
      const s2 = calculateSingleSkill(t2);
      const s3 = calculateSingleSkill(t3);
      return {
        gold: s1.gold + s2.gold + s3.gold,
        silver: s1.silver + s2.silver + s3.silver,
        brown: s1.brown + s2.brown + s3.brown
      };
    }

    let characters = [];
    let debounceTimer = null;

    async function loadData() {
      const local = localStorage.getItem(LOCAL_KEY);
      if (local) {
        try { characters = JSON.parse(local); } catch (e) { characters = []; }
      }

      if (!Array.isArray(characters) || characters.length === 0) {
        characters = [{ id: 'c_' + Date.now(), name: '', days: '一/四', t1: '', t2: '', t3: '', haveGold: '', haveSilver: '', haveBrown: '' }];
      }

      render();

      if (!JSONBIN_CONFIG.enabled || !JSONBIN_CONFIG.binId || !JSONBIN_CONFIG.apiKey) {
        return;
      }

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.binId}/latest`, {
          headers: {
            'X-Master-Key': JSONBIN_CONFIG.apiKey,
            'X-Access-Key': JSONBIN_CONFIG.apiKey
          }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.record && Array.isArray(data.record.characters)) {
          characters = data.record.characters;
          localStorage.setItem(LOCAL_KEY, JSON.stringify(characters));
          render();
        }
      } catch (err) {
        console.warn("云端拉取失败，已使用本地数据:", err);
      }
    }

    function saveData() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(characters));

      if (!JSONBIN_CONFIG.enabled || !JSONBIN_CONFIG.binId || !JSONBIN_CONFIG.apiKey) {
        return;
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.binId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_CONFIG.apiKey,
              'X-Access-Key': JSONBIN_CONFIG.apiKey
            },
            body: JSON.stringify({ characters })
          });
        } catch (e) {
          console.error("云端自动保存失败:", e);
        }
      }, 700);
    }

    function updateBadges(cardEl, char) {
      const costs = calculateTotalCost(char.t1, char.t2, char.t3);
      const goldSpan = cardEl.querySelector('.count-gold');
      const silverSpan = cardEl.querySelector('.count-silver');
      const brownSpan = cardEl.querySelector('.count-brown');
      if (goldSpan) goldSpan.textContent = costs.gold;
      if (silverSpan) silverSpan.textContent = costs.silver;
      if (brownSpan) brownSpan.textContent = costs.brown;
    }

    function render() {
      const container = document.getElementById('character-list');
      container.innerHTML = '';

      characters.forEach((char, index) => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded p-1.5 flex flex-col gap-1.5 shadow-sm";
        card.dataset.id = char.id || index;

        // 第一排：角色名 + 副本时间 + 删除按钮
        const row1 = document.createElement('div');
        row1.className = "flex items-center gap-1";

        const nameInput = document.createElement('input');
        nameInput.type = "text";
        nameInput.placeholder = "角色名";
        nameInput.value = char.name || '';
        nameInput.className = "w-[68px] px-1 py-0.5 text-[11px] bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition";
        nameInput.oninput = (e) => {
          characters[index].name = e.target.value;
          saveData();
        };

        const select = document.createElement('select');
        select.className = "w-[64px] px-0.5 py-0.5 text-[10px] bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded text-slate-700 dark:text-slate-200 cursor-pointer focus:outline-none focus:border-slate-400 transition";
        ['一/四', '二/五', '三/六'].forEach(day => {
          const opt = document.createElement('option');
          opt.value = day;
          opt.textContent = day;
          if ((char.days || '一/四') === day) opt.selected = true;
          select.appendChild(opt);
        });
        select.onchange = (e) => {
          characters[index].days = e.target.value;
          saveData();
        };

        const delBtn = document.createElement('button');
        delBtn.type = "button";
        delBtn.innerHTML = "×";
        delBtn.className = "ml-auto text-slate-400 hover:text-rose-500 active:scale-95 text-xs font-bold leading-none px-1 py-0.5 rounded transition";
        delBtn.title = "删除此角色";
        delBtn.onclick = () => {
          characters.splice(index, 1);
          if (characters.length === 0) {
            characters.push({ id: 'c_' + Date.now(), name: '', days: '一/四', t1: '', t2: '', t3: '', haveGold: '', haveSilver: '', haveBrown: '' });
          }
          render();
          saveData();
        };

        row1.appendChild(nameInput);
        row1.appendChild(select);
        row1.appendChild(delBtn);

        // 第二排：三个技能等级输入框
        const row2 = document.createElement('div');
        row2.className = "grid grid-cols-3 gap-1";

        ['t1', 't2', 't3'].forEach(key => {
          const numInput = document.createElement('input');
          numInput.type = "number";
          numInput.min = "1";
          numInput.max = "10";
          numInput.placeholder = "1";
          numInput.value = (char[key] !== undefined && char[key] !== null) ? char[key] : '';
          numInput.className = "w-full text-center py-0.5 text-xs font-semibold bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded text-slate-800 dark:text-slate-100 focus:outline-none focus:border-slate-400 transition";
          numInput.oninput = (e) => {
            let val = e.target.value;
            if (val !== '') {
              let num = parseInt(val, 10);
              if (num > 10) num = 10;
              if (num < 1) num = 1;
              val = num;
              e.target.value = num;
            }
            characters[index][key] = val;
            updateBadges(card, characters[index]);
            saveData();
          };
          row2.appendChild(numInput);
        });

        // 第三排：各品阶天赋书 (每种占一排：左侧所需，右侧已有输入框)
        const row3 = document.createElement('div');
        row3.className = "flex flex-col gap-1 pt-1 border-t border-slate-100 dark:border-slate-800/80";

        const bookTypes = [
          {
            key: 'haveGold',
            title: '金色天赋书',
            dotColor: '#f59e0b',
            boxClass: 'bg-amber-500/10 border-amber-500/20',
            countClass: 'count-gold text-amber-700 dark:text-amber-300'
          },
          {
            key: 'haveSilver',
            title: '银色天赋书',
            dotColor: '#94a3b8',
            boxClass: 'bg-slate-500/10 border-slate-500/20',
            countClass: 'count-silver text-slate-700 dark:text-slate-300'
          },
          {
            key: 'haveBrown',
            title: '棕色天赋书',
            dotColor: '#c69468',
            boxStyle: 'background-color: rgba(198, 148, 104, 0.1); border-color: rgba(198, 148, 104, 0.28);',
            countClass: 'count-brown',
            countStyle: 'color: #c69468;'
          }
        ];

        bookTypes.forEach(book => {
          const itemRow = document.createElement('div');
          itemRow.className = "grid grid-cols-2 gap-1 items-center";

          // 左侧：所需数量展示
          const needBox = document.createElement('div');
          needBox.className = `flex items-center justify-center gap-1 rounded py-0.5 border ${book.boxClass || ''}`;
          if (book.boxStyle) needBox.style.cssText = book.boxStyle;
          needBox.title = book.title + "所需";
          needBox.innerHTML = `
            <span class="w-[5px] h-[5px] rounded-full shrink-0" style="background-color: ${book.dotColor};"></span>
            <span class="${book.countClass} text-xs font-bold leading-none" ${book.countStyle ? `style="${book.countStyle}"` : ''}>0</span>
          `;

          // 右侧：已有数量输入框
          const ownedInput = document.createElement('input');
          ownedInput.type = "number";
          ownedInput.min = "0";
          ownedInput.placeholder = "已有";
          ownedInput.value = (char[book.key] !== undefined && char[book.key] !== null) ? char[book.key] : '';
          ownedInput.className = "w-full text-center py-0.5 text-xs font-semibold bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition";
          ownedInput.oninput = (e) => {
            let val = e.target.value;
            if (val !== '') {
              let num = parseInt(val, 10);
              if (isNaN(num) || num < 0) num = 0;
              val = num;
              e.target.value = num;
            }
            characters[index][book.key] = val;
            saveData();
          };

          itemRow.appendChild(needBox);
          itemRow.appendChild(ownedInput);
          row3.appendChild(itemRow);
        });

        card.appendChild(row1);
        card.appendChild(row2);
        card.appendChild(row3);

        updateBadges(card, char);
        container.appendChild(card);
      });
    }

    // 添加新角色按钮点击监听
    document.getElementById('add-btn').onclick = () => {
      characters.push({
        id: 'c_' + Date.now() + Math.random().toString(36).slice(2, 5),
        name: '',
        days: '一/四',
        t1: '',
        t2: '',
        t3: '',
        haveGold: '',
        haveSilver: '',
        haveBrown: ''
      });
      render();
      saveData();
      setTimeout(() => {
        const lastInput = document.querySelector('#character-list > div:last-child input[type="text"]');
        if (lastInput) lastInput.focus();
      }, 50);
    };

    // 初始加载
    loadData();
  </script>
</body>
</html>
