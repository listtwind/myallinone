<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天赋书计算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            notionDark: '#191919',
            notionCardDark: '#202020',
            notionBorderDark: '#2f343b',
            genshinBrown: '#c69468',
          }
        }
      }
    }
  </script>
  <style>
    /* 严格锁定视口宽度为 180px */
    html, body {
      width: 180px;
      max-width: 180px;
      min-width: 180px;
      margin: 0 auto;
      box-sizing: border-box;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    /* 隐藏数字输入框默认的微调箭头以节省紧凑空间 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="p-2 bg-transparent text-[#37352f] dark:text-[#d4d4d4] select-none transition-colors duration-200">

  <!-- 顶部标题栏：纯文本无任何图标与多余元素 -->
  <header class="pb-1.5 mb-2 border-b border-[#e9e9e7] dark:border-[#2f343b] flex items-center">
    <h1 class="text-xs font-semibold tracking-tight text-gray-800 dark:text-gray-200">天赋书计算器</h1>
  </header>

  <!-- 角色卡片列表容器 -->
  <div id="charactersList" class="flex flex-col gap-2"></div>

  <!-- 添加新角色按钮 -->
  <button 
    id="addCharBtn"
    type="button"
    class="w-full mt-2 py-1.5 text-[11px] font-medium text-gray-500 dark:text-gray-400 border border-dashed border-[#dcdad5] dark:border-[#383d46] hover:border-gray-400 dark:hover:border-gray-500 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-black/[0.02] dark:hover:bg-white/[0.02] rounded-md transition flex items-center justify-center gap-1 active:scale-[0.98]"
  >
    <span>＋</span> 添加角色
  </button>

  <script>
    // 单技能各等级升级所需消耗数据表 (1~10级)
    const LEVEL_COSTS = [
      { brown: 0, silver: 0, gold: 0 },  // 1级
      { brown: 3, silver: 0, gold: 0 },  // 2级
      { brown: 0, silver: 2, gold: 0 },  // 3级
      { brown: 0, silver: 4, gold: 0 },  // 4级
      { brown: 0, silver: 6, gold: 0 },  // 5级
      { brown: 0, silver: 9, gold: 0 },  // 6级
      { brown: 0, silver: 0, gold: 4 },  // 7级
      { brown: 0, silver: 0, gold: 6 },  // 8级
      { brown: 0, silver: 0, gold: 12 }, // 9级
      { brown: 0, silver: 0, gold: 16 }, // 10级
    ];

    // 计算单项技能升级至指定等级累计消耗
    function getSkillTotal(targetLevel) {
      let b = 0, s = 0, g = 0;
      const lvl = Math.min(Math.max(parseInt(targetLevel, 10) || 1, 1), 10);
      for (let i = 1; i < lvl; i++) {
        b += LEVEL_COSTS[i].brown;
        s += LEVEL_COSTS[i].silver;
        g += LEVEL_COSTS[i].gold;
      }
      return { brown: b, silver: s, gold: g };
    }

    // 计算角色 3 个技能的总累计消耗
    function calculateCharacterTotal(char) {
      const a = getSkillTotal(char.a);
      const e = getSkillTotal(char.e);
      const q = getSkillTotal(char.q);
      return {
        brown: a.brown + e.brown + q.brown,
        silver: a.silver + e.silver + q.silver,
        gold: a.gold + e.gold + q.gold
      };
    }

    const STORAGE_KEY = 'genshin_talent_notion_widget_v2';
    const SCHEDULE_OPTIONS = ['一/四', '二/五', '三/六'];
    const charactersListEl = document.getElementById('charactersList');
    let characters = [];

    // 从 localStorage 读取历史配置
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          characters = JSON.parse(saved);
        }
      } catch (err) {
        characters = [];
      }

      // 规范化开放日选项，确保仅存在 3 个合规值
      if (Array.isArray(characters)) {
        characters.forEach(char => {
          if (!SCHEDULE_OPTIONS.includes(char.schedule)) {
            char.schedule = SCHEDULE_OPTIONS[0];
          }
        });
      }

      // 若首次加载或数据为空，提供一个默认空白卡片
      if (!Array.isArray(characters) || characters.length === 0) {
        characters = [
          {
            id: 'c_' + Date.now(),
            name: '',
            schedule: SCHEDULE_OPTIONS[0],
            a: '',
            e: '',
            q: ''
          }
        ];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));
      } catch (err) {}
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    // 局部更新卡片结果数值（金左、银中、棕右）
    function updateCardBadges(cardEl, char) {
      const total = calculateCharacterTotal(char);
      const goldEl = cardEl.querySelector('[data-type="gold"]');
      const silverEl = cardEl.querySelector('[data-type="silver"]');
      const brownEl = cardEl.querySelector('[data-type="brown"]');
      if (goldEl) goldEl.textContent = total.gold;
      if (silverEl) silverEl.textContent = total.silver;
      if (brownEl) brownEl.textContent = total.brown;
    }

    // 渲染所有角色卡片
    function renderCards() {
      charactersListEl.innerHTML = '';

      characters.forEach((char) => {
        const totals = calculateCharacterTotal(char);
        const card = document.createElement('div');
        card.className = "p-1.5 rounded-lg bg-white dark:bg-[#202020] border border-[#e8e7e3] dark:border-[#2f343b] shadow-sm flex flex-col gap-1.5 transition-all";
        card.dataset.id = char.id;

        // 生成开放时间下拉选项
        const makeScheduleOptions = (cur) => {
          return SCHEDULE_OPTIONS.map(day => 
            `<option value="${day}" ${day === cur ? 'selected' : ''}>${day}</option>`
          ).join('');
        };

        card.innerHTML = `
          <!-- 第一排：角色名输入框、开放时间下拉菜单、删除按钮 -->
          <div class="flex items-center gap-1 justify-between">
            <input 
              type="text" 
              placeholder="角色名" 
              value="${escapeHtml(char.name)}" 
              data-field="name" 
              class="w-[78px] px-1.5 py-0.5 text-xs font-medium rounded border border-[#e2e1dc] dark:border-[#383d46] bg-gray-50/70 dark:bg-[#161616] text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition"
            />
            <select 
              data-field="schedule" 
              class="w-[66px] px-1 py-0.5 text-[10px] font-medium rounded border border-[#e2e1dc] dark:border-[#383d46] bg-gray-50/70 dark:bg-[#161616] text-gray-700 dark:text-gray-300 cursor-pointer focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition"
              title="天赋书副本开放日"
            >
              ${makeScheduleOptions(char.schedule)}
            </select>
            <button 
              type="button" 
              data-action="delete" 
              class="w-4 h-4 flex items-center justify-center text-gray-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition text-xs font-bold leading-none"
              title="删除此角色"
            >×</button>
          </div>

          <!-- 第二排：3个纯数字等级输入框（无汉字标识） -->
          <div class="grid grid-cols-3 gap-1">
            <input 
              type="number" 
              min="1" 
              max="10" 
              placeholder="1"
              value="${char.a || ''}" 
              data-field="a" 
              class="w-full py-0.5 text-center text-xs font-semibold rounded border border-[#e2e1dc] dark:border-[#383d46] bg-gray-50/70 dark:bg-[#161616] text-gray-800 dark:text-gray-200 focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition"
            />
            <input 
              type="number" 
              min="1" 
              max="10" 
              placeholder="1"
              value="${char.e || ''}" 
              data-field="e" 
              class="w-full py-0.5 text-center text-xs font-semibold rounded border border-[#e2e1dc] dark:border-[#383d46] bg-gray-50/70 dark:bg-[#161616] text-gray-800 dark:text-gray-200 focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition"
            />
            <input 
              type="number" 
              min="1" 
              max="10" 
              placeholder="1"
              value="${char.q || ''}" 
              data-field="q" 
              class="w-full py-0.5 text-center text-xs font-semibold rounded border border-[#e2e1dc] dark:border-[#383d46] bg-gray-50/70 dark:bg-[#161616] text-gray-800 dark:text-gray-200 focus:outline-none focus:border-blue-400 dark:focus:border-blue-500 transition"
            />
          </div>

          <!-- 第三排：天赋书计算结果展示（金左、银中、棕右；棕色使用指定色值 #c69468） -->
          <div class="grid grid-cols-3 gap-1 pt-0.5 border-t border-gray-100 dark:border-gray-800/60">
            <!-- 金色天赋书 -->
            <div class="flex items-center justify-center gap-1 bg-amber-50 dark:bg-amber-950/20 py-0.5 px-0.5 rounded border border-amber-200/60 dark:border-amber-800/40" title="金色天赋书 (4星)">
              <span class="w-[5px] h-[5px] rounded-full bg-amber-400 shrink-0"></span>
              <span data-type="gold" class="text-xs font-bold text-amber-700 dark:text-amber-300 leading-none">${totals.gold}</span>
            </div>

            <!-- 银色天赋书 -->
            <div class="flex items-center justify-center gap-1 bg-slate-100/90 dark:bg-slate-800/30 py-0.5 px-0.5 rounded border border-slate-200 dark:border-slate-700/50" title="银色天赋书 (3星)">
              <span class="w-[5px] h-[5px] rounded-full bg-slate-400 shrink-0"></span>
              <span data-type="silver" class="text-xs font-bold text-slate-700 dark:text-slate-300 leading-none">${totals.silver}</span>
            </div>

            <!-- 棕色天赋书：精准指定 #c69468 -->
            <div class="flex items-center justify-center gap-1 py-0.5 px-0.5 rounded border leading-none" 
                 style="background-color: rgba(198, 148, 104, 0.12); border-color: rgba(198, 148, 104, 0.35);" 
                 title="棕色天赋书 (2星)">
              <span class="w-[5px] h-[5px] rounded-full shrink-0" style="background-color: #c69468;"></span>
              <span data-type="brown" class="text-xs font-bold leading-none" style="color: #9f6636;">${totals.brown}</span>
            </div>
          </div>
        `;
        charactersListEl.appendChild(card);
      });
    }

    // 监听实时输入事件，就地更新数据避免打断光标
    charactersListEl.addEventListener('input', (e) => {
      const target = e.target;
      const card = target.closest('[data-id]');
      if (!card) return;

      const id = card.dataset.id;
      const field = target.dataset.field;
      const char = characters.find(c => c.id === id);
      if (!char) return;

      if (field === 'name') {
        char.name = target.value;
        saveData();
      } else if (['a', 'e', 'q'].includes(field)) {
        if (target.value === '') {
          char[field] = '';
          saveData();
          updateCardBadges(card, char);
        } else {
          let val = parseInt(target.value, 10);
          if (!isNaN(val)) {
            if (val > 10) {
              val = 10;
              target.value = 10;
            }
            char[field] = val;
            saveData();
            updateCardBadges(card, char);
          }
        }
      }
    });

    // 监听失焦/数值变更以校验合法性
    charactersListEl.addEventListener('change', (e) => {
      const target = e.target;
      const card = target.closest('[data-id]');
      if (!card) return;

      const id = card.dataset.id;
      const field = target.dataset.field;
      const char = characters.find(c => c.id === id);
      if (!char) return;

      if (field === 'schedule') {
        char.schedule = target.value;
        saveData();
      } else if (['a', 'e', 'q'].includes(field)) {
        if (target.value === '') {
          char[field] = '';
        } else {
          let val = parseInt(target.value, 10);
          if (isNaN(val) || val < 1) val = 1;
          if (val > 10) val = 10;
          char[field] = val;
          target.value = val;
        }
        saveData();
        updateCardBadges(card, char);
      }
    });

    // 删除角色卡片
    charactersListEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action="delete"]');
      if (!btn) return;

      const card = btn.closest('[data-id]');
      if (!card) return;

      const id = card.dataset.id;
      characters = characters.filter(c => c.id !== id);
      if (characters.length === 0) {
        characters.push({ id: 'c_' + Date.now(), name: '', schedule: SCHEDULE_OPTIONS[0], a: '', e: '', q: '' });
      }
      saveData();
      renderCards();
    });

    // 点击添加角色卡片
    document.getElementById('addCharBtn').addEventListener('click', () => {
      characters.push({
        id: 'c_' + Date.now() + Math.random().toString(36).substr(2, 4),
        name: '',
        schedule: SCHEDULE_OPTIONS[0],
        a: '',
        e: '',
        q: ''
      });
      saveData();
      renderCards();

      // 自动聚焦新角色的名称输入框
      setTimeout(() => {
        const lastCard = charactersListEl.lastElementChild;
        if (lastCard) {
          const input = lastCard.querySelector('input[data-field="name"]');
          if (input) input.focus();
        }
      }, 50);
    });

    // 自适应 Notion / 操作系统明暗模式
    function syncTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    syncTheme();
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
    }

    // 初始化加载
    loadData();
    renderCards();
  </script>
</body>
</html>
