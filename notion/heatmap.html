<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>番茄钟数量</title>
  <style>
    :root {
      --cell-size: 14px;
      --cell-gap: 5px;
      --color-empty: #f1f5f9;
      --color-empty-border: #e4e9ed;
      --color-level-1: #fca5a5;
      --color-level-2: #f87171;
      --color-level-3: #ef4444;
      --color-level-4: #dc2626;
      --color-level-5: #b91c1c;
      --color-level-max: #991b1b;
      --color-today-border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background: transparent;
      color: #1e293b;
      display: flex;
      justify-content: center;
    }

    .heatmap-container {
      display: inline-block;
      background: transparent;
      padding: 20px 24px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .main-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.02em;
    }

    .year-display {
      font-size: 14px;
      font-style: italic;
      color: #64748b;
      font-weight: 500;
      user-select: none;
    }

    .heatmap-wrapper {
      display: flex;
      flex-direction: column;
    }

    /* 月份标头栏：增加 3px 底部间距 */
    .months-header {
      display: grid;
      grid-template-columns: repeat(53, var(--cell-size));
      gap: var(--cell-gap);
      margin-left: 28px;
      margin-bottom: 3px;
      height: 18px;
      font-size: 11px;
      color: #64748b;
      font-weight: 400;
    }

    .month-label {
      grid-column-start: var(--col);
      white-space: nowrap;
    }

    .main-grid {
      display: flex;
    }

    /* 星期标头栏 */
    .weekdays-header {
      display: grid;
      grid-template-rows: repeat(7, var(--cell-size));
      gap: var(--cell-gap);
      margin-right: 8px;
      font-size: 10px;
      color: #64748b;
      line-height: var(--cell-size);
      text-align: left;
      width: 20px;
      user-select: none;
    }

    /* 热力图网格 */
    .days-grid {
      display: grid;
      grid-template-rows: repeat(7, var(--cell-size));
      grid-auto-flow: column;
      grid-auto-columns: var(--cell-size);
      gap: var(--cell-gap);
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 2px;
      background-color: var(--color-empty);
      border: 1px solid var(--color-empty-border);
      font-size: 9px;
      line-height: calc(var(--cell-size) - 2px);
      text-align: center;
      color: transparent;
      cursor: pointer;
      user-select: none;
      box-sizing: border-box;
      transition: transform 0.1s;
    }

    .cell:hover {
      outline: 1px solid #0f172a;
      transform: scale(1.15);
      z-index: 10;
    }

    /* 色阶变量映射 */
    .cell[data-count="0"] { --current-level-color: transparent; }
    .cell[data-count="1"] { --current-level-color: var(--color-level-1); }
    .cell[data-count="2"] { --current-level-color: var(--color-level-2); }
    .cell[data-count="3"] { --current-level-color: var(--color-level-3); }
    .cell[data-count="4"] { --current-level-color: var(--color-level-4); }
    .cell[data-count="5"] { --current-level-color: var(--color-level-5); }
    .cell[data-level="max"] { --current-level-color: var(--color-level-max); }

    /* 普通方块数据填充 */
    .cell.has-data {
      background-color: var(--current-level-color);
      border: 1px solid var(--current-level-color);
      color: #ffffff !important;
      font-weight: 600;
    }

    /* 当天：数量为 0 时边框增至 2px */
    .cell.is-today[data-count="0"] {
      outline: 2px solid var(--color-today-border);
      outline-offset: -2px;
      position: relative;
      z-index: 2;
    }

    /* 当天：有番茄数时边框增至 2px，内里文字加粗 */
    .cell.is-today.has-data {
      background-color: var(--color-empty) !important;
      border: 1px solid var(--current-level-color) !important;
      line-height: calc(var(--cell-size) - 4px);
      color: var(--current-level-color) !important;
      font-weight: 600 !important;
      outline: none;
      position: relative;
      z-index: 2;
    }

    /* 右下角统计栏 */
    .footer-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }

    .total-count-value {
      font-weight: 700;
      color: #1e293b;
      margin: 0 3px;
    }
  </style>
</head>
<body>

<div class="heatmap-container">
  <div class="header-bar">
    <div class="main-title">番茄钟数量</div>
    <div class="year-display" id="yearDisplay"></div>
  </div>

  <div class="heatmap-wrapper">
    <div class="months-header" id="monthsHeader"></div>
    <div class="main-grid">
      <div class="weekdays-header">
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>
        <div>日</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>
  </div>

  <div class="footer-bar">
    <div>番茄总数：<span id="totalCount" class="total-count-value">0</span> 个</div>
  </div>
</div>

<script>
  function formatLocalDate(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  const today = new Date();
  const todayStr = formatLocalDate(today);
  const currentYear = today.getFullYear();

  document.getElementById('yearDisplay').innerText = currentYear;

  const monthsHeader = document.getElementById('monthsHeader');
  const daysGrid = document.getElementById('daysGrid');
  const totalCountEl = document.getElementById('totalCount');
  const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

  function updateTotal(records) {
    const sum = Object.values(records).reduce((acc, cur) => acc + (Number(cur) || 0), 0);
    totalCountEl.innerText = sum;
  }

  function renderHeatmap() {
    daysGrid.innerHTML = '';
    monthsHeader.innerHTML = '';

    const storageKey = `pomodoro_data_${currentYear}`;
    let records = JSON.parse(localStorage.getItem(storageKey)) || {};

    updateTotal(records);

    const startDate = new Date(currentYear, 0, 1);
    const endDate = new Date(currentYear, 11, 31);
    const startDayOfWeek = (startDate.getDay() + 6) % 7;

    for (let i = 0; i < startDayOfWeek; i++) {
      const placeholder = document.createElement('div');
      placeholder.style.visibility = 'hidden';
      daysGrid.appendChild(placeholder);
    }

    let currentDate = new Date(startDate);
    let currentMonth = -1;
    let dayCounter = startDayOfWeek;

    while (currentDate <= endDate) {
      const dateStr = formatLocalDate(currentDate);
      const count = records[dateStr] || 0;
      const month = currentDate.getMonth();

      const weekCol = Math.floor(dayCounter / 7) + 1;
      if (month !== currentMonth) {
        currentMonth = month;
        const monthLabel = document.createElement('div');
        monthLabel.className = 'month-label';
        monthLabel.style.setProperty('--col', weekCol);
        monthLabel.innerText = monthNames[month];
        monthsHeader.appendChild(monthLabel);
      }

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.date = dateStr;

      if (dateStr === todayStr) {
        cell.classList.add('is-today');
      }

      updateCellVisual(cell, count);

      cell.addEventListener('click', () => {
        records[dateStr] = (records[dateStr] || 0) + 1;
        localStorage.setItem(storageKey, JSON.stringify(records));
        updateCellVisual(cell, records[dateStr]);
        updateTotal(records);
      });

      cell.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if ((records[dateStr] || 0) > 0) {
          records[dateStr] -= 1;
          if (records[dateStr] === 0) delete records[dateStr];
          localStorage.setItem(storageKey, JSON.stringify(records));
          updateCellVisual(cell, records[dateStr] || 0);
          updateTotal(records);
        }
      });

      daysGrid.appendChild(cell);

      currentDate.setDate(currentDate.getDate() + 1);
      dayCounter++;
    }
  }

  function updateCellVisual(cell, count) {
    cell.dataset.count = count;
    cell.innerText = count > 0 ? count : '';
    cell.title = `${cell.dataset.date}: ${count} 个番茄`;

    if (count >= 6) {
      cell.dataset.level = 'max';
    } else {
      delete cell.dataset.level;
    }

    if (count > 0) {
      cell.classList.add('has-data');
    } else {
      cell.classList.remove('has-data');
    }
  }

  renderHeatmap();
</script>

</body>
</html>
