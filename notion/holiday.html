<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时小组件</title>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffffff;
    }

    .countdown-container {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        display: inline-block;
        padding: 10px;
    }
    
    .countdown-title {
        font-size: 20px;
        font-weight: bold;
        color: #333333;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    
    .countdown-timer {
        font-size: 16px;
        color: #555555;
    }
</style>
</head>
<body>

<div class="countdown-container">
    <div class="countdown-title">
        距离「<span id="holiday-name">加载中</span>」还有：
    </div>
    <div class="countdown-timer" id="timer-display">
        加载中...
    </div>
</div>

<script>
    // ==========================================
    // 配置区域：按时间先后顺序配置节假日
    // 格式："YYYY/MM/DD HH:mm:ss"
    // ==========================================
    const holidayList = [
        { name: "元旦",   date: "2026/01/01 00:00:00" },
        { name: "春节",   date: "2026/02/17 00:00:00" },
        { name: "清明",   date: "2026/04/05 00:00:00" },
        { name: "五一", date: "2026/05/01 00:00:00" },
        { name: "端午",   date: "2026/06/19 00:00:00" },
        { name: "中秋",   date: "2026/09/25 00:00:00" },
        { name: "国庆",   date: "2026/10/01 00:00:00" },
        // 跨年顺延节假日
        { name: "元旦",   date: "2027/01/01 00:00:00" },
        { name: "春节",   date: "2027/02/06 00:00:00" }
    ];

    // ==========================================
    // 核心逻辑区域
    // ==========================================
    const holidayNameEl = document.getElementById('holiday-name');
    const timerDisplayEl = document.getElementById('timer-display');

    function updateTimer() {
        const now = new Date().getTime();
        
        // 查找下一个未过期的节假日
        const nextHoliday = holidayList.find(item => {
            return new Date(item.date).getTime() > now;
        });

        // 边界兜底保护（仅在列表全部耗尽时触发）
        if (!nextHoliday) {
            holidayNameEl.textContent = "待配置";
            timerDisplayEl.textContent = "请更新节假日列表";
            return;
        }

        holidayNameEl.textContent = nextHoliday.name;
        
        const targetDate = new Date(nextHoliday.date).getTime();
        const distance = targetDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        timerDisplayEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
